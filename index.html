<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Management System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    input {
      width: 70%;
      padding: 10px;
      margin-right: 10px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    .present {
      background: #4CAF50;
      color: white;
    }

    .absent {
      background: #f44336;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Attendance Management System</h2>

  <input type="text" id="studentName" placeholder="Enter student name">
  <button onclick="addStudent()">Add</button>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="studentList"></tbody>
  </table>
</div>

<script>
  let students = JSON.parse(localStorage.getItem("students")) || [];

  function saveData() {
    localStorage.setItem("students", JSON.stringify(students));
  }

  function render() {
    const list = document.getElementById("studentList");
    list.innerHTML = "";

    students.forEach((student, index) => {
      list.innerHTML += `
        <tr>
          <td>${student.name}</td>
          <td>${student.status}</td>
          <td>
            <button class="present" onclick="markPresent(${index})">Present</button>
            <button class="absent" onclick="markAbsent(${index})">Absent</button>
            <button onclick="removeStudent(${index})">Delete</button>
          </td>
        </tr>
      `;
    });

    saveData();
  }

  function addStudent() {
    const name = document.getElementById("studentName").value;

    if (name === "") {
      alert("Please enter a name");
      return;
    }

    students.push({ name: name, status: "Not Marked" });
    document.getElementById("studentName").value = "";
    render();
  }

  function markPresent(index) {
    students[index].status = "Present";
    render();
  }

  function markAbsent(index) {
    students[index].status = "Absent";
    render();
  }

  function removeStudent(index) {
    students.splice(index, 1);
    render();
  }

  render();
</script>

</body>
</html>
